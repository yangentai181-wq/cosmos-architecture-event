<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="930" viewBox="0 0 1700 930" role="img" aria-labelledby="title desc">
  <title id="title">同一84室・延床3000平方メートルの4階、5階、6階、7階、10階の均等積層比較</title>
  <desc id="desc">平均一層床と単純未建築余地を比較する模式図。実際の建築面積や地上空地の成立を示すものではない。7階は最初に描く検証枝で、優位案は未確定。</desc>
  <defs>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", sans-serif; fill: #142633; }
      .head { font-size: 34px; font-weight: 900; }
      .sub { font-size: 17px; fill: #5d6b72; }
      .panelTitle { font-size: 24px; font-weight: 900; }
      .metric { font-size: 16px; font-weight: 700; }
      .note { font-size: 14px; fill: #5d6b72; }
      .resident { fill: #dce9e1; stroke: #305f52; stroke-width: 2; }
      .base { fill: #e9e7e2; stroke: #5f5b54; stroke-width: 2; }
      .public { fill: #f8d9cf; stroke: #ba4934; stroke-width: 2; }
      .unallocated { fill: #e7eaec; stroke: #67727a; stroke-width: 2; }
      .average { fill: #ddd8ce; stroke: #7c7568; stroke-width: 2; }
      .warn { fill: #fff2cf; stroke: #a87311; stroke-width: 2; }
      .next { fill: #fffdf5; stroke: #a87311; stroke-width: 4; stroke-dasharray: 10 7; }
    </style>
  </defs>

  <rect width="1700" height="930" rx="28" fill="#fffdf8"/>
  <text x="45" y="54" class="head">高さの順位ではなく、実平面へ進む枝を選ぶ</text>
  <text x="45" y="84" class="sub">同じ84個室・12ユニット・容積対象床3,000㎡｜公開＋緩衝165㎡は需要実証前の中心仮説</text>
  <g transform="translate(1160 46)">
    <rect x="0" y="0" width="24" height="18" class="resident"/><text x="33" y="15" class="note">居住者専用</text>
    <rect x="145" y="0" width="24" height="18" class="base"/><text x="178" y="15" class="note">1階全体</text>
    <rect x="0" y="30" width="24" height="18" class="public"/><text x="33" y="45" class="note">公開＋緩衝165㎡範囲仮説</text>
    <text x="33" y="66" class="note">全域へ外来者が立入る意味ではない</text>
  </g>

  <g transform="translate(25 118)">
    <rect width="310" height="600" rx="22" fill="#fff" stroke="#d9d4c8" stroke-width="2"/>
    <text x="24" y="42" class="panelTitle">4階｜低層</text>
    <text x="24" y="70" class="note">3居住階 × 28人</text>
    <g transform="translate(30 105)">
      <rect x="0" y="300" width="225" height="28" class="base"/>
      <rect x="0" y="300" width="50" height="28" class="public"/>
      <rect x="0" y="270" width="225" height="27" class="resident"/>
      <rect x="0" y="240" width="225" height="27" class="resident"/>
      <rect x="0" y="210" width="225" height="27" class="resident"/>
      <text x="64" y="230" class="metric">4 unit / 階</text>
      <text x="0" y="355" class="note">平均一層床750㎡</text>
      <rect x="0" y="380" width="63" height="46" class="unallocated"/>
      <rect x="63" y="380" width="187" height="46" class="average"/>
      <text x="7" y="409" class="note">25%</text>
      <text x="105" y="409" class="note">平均床75%</text>
    </g>
    <text x="24" y="553" class="metric" fill="#9c3725">単純余地−最低区画 = −21.1㎡</text>
    <text x="24" y="579" class="note">現行17台平置き仮定で優先度低</text>
  </g>

  <g transform="translate(360 118)">
    <rect width="310" height="600" rx="22" fill="#fff" stroke="#d9d4c8" stroke-width="2"/>
    <text x="24" y="42" class="panelTitle">5階｜低中層</text>
    <text x="24" y="70" class="note">4居住階 × 21人</text>
    <g transform="translate(30 105)">
      <rect x="0" y="300" width="180" height="28" class="base"/>
      <rect x="0" y="300" width="50" height="28" class="public"/>
      <rect x="0" y="270" width="180" height="27" class="resident"/>
      <rect x="0" y="240" width="180" height="27" class="resident"/>
      <rect x="0" y="210" width="180" height="27" class="resident"/>
      <rect x="0" y="180" width="180" height="27" class="resident"/>
      <text x="42" y="200" class="metric">3 unit / 階</text>
      <text x="0" y="355" class="note">平均一層床600㎡</text>
      <rect x="0" y="380" width="100" height="46" class="unallocated"/>
      <rect x="100" y="380" width="150" height="46" class="average"/>
      <text x="12" y="409" class="note">単純余地40%</text>
      <text x="135" y="409" class="note">平均床60%</text>
    </g>
    <text x="24" y="553" class="metric">単純余地−最低区画 = 128.9㎡</text>
    <text x="24" y="579" class="note">駐車条件を分けて実平面比較</text>
  </g>

  <g transform="translate(695 118)">
    <rect width="310" height="600" rx="22" fill="#fff" stroke="#d9d4c8" stroke-width="2"/>
    <text x="24" y="42" class="panelTitle">6階｜反証枝</text>
    <text x="24" y="70" class="note">5居住階 × 平均16.8人</text>
    <g transform="translate(30 105)">
      <rect x="0" y="300" width="150" height="28" class="base"/>
      <rect x="0" y="300" width="50" height="28" class="public"/>
      <rect x="0" y="270" width="150" height="27" class="resident"/>
      <rect x="0" y="240" width="150" height="27" class="resident"/>
      <rect x="0" y="210" width="150" height="27" class="resident"/>
      <rect x="0" y="180" width="150" height="27" class="resident"/>
      <rect x="0" y="150" width="150" height="27" class="resident"/>
      <text x="162" y="167" class="note">3+3+2+2+2 unit</text>
      <text x="162" y="188" class="note">均等床には収まらない</text>
      <text x="0" y="355" class="note">平均一層床500㎡</text>
      <rect x="0" y="380" width="125" height="46" class="unallocated"/>
      <rect x="125" y="380" width="125" height="46" class="average"/>
      <text x="12" y="409" class="note">単純余地50%</text>
      <text x="151" y="409" class="note">平均床50%</text>
    </g>
    <text x="24" y="553" class="metric">単純余地−最低区画 = 228.9㎡</text>
    <text x="24" y="579" class="note">段状・不均等床を描いて比較</text>
  </g>

  <g transform="translate(1030 118)">
    <rect width="310" height="600" rx="22" class="next"/>
    <text x="24" y="42" class="panelTitle">7階｜先行検証</text>
    <text x="24" y="70" class="note">6居住階 × 14人｜優位未確定</text>
    <g transform="translate(30 105)">
      <rect x="0" y="300" width="129" height="28" class="base"/>
      <rect x="0" y="300" width="50" height="28" class="public"/>
      <rect x="0" y="270" width="129" height="27" class="resident"/>
      <rect x="0" y="240" width="129" height="27" class="resident"/>
      <rect x="0" y="210" width="129" height="27" class="resident"/>
      <rect x="0" y="180" width="129" height="27" class="resident"/>
      <rect x="0" y="150" width="129" height="27" class="resident"/>
      <rect x="0" y="120" width="129" height="27" class="resident"/>
      <text x="142" y="138" class="metric">2 unit / 階</text>
      <text x="0" y="355" class="note">平均一層床428.6㎡</text>
      <rect x="0" y="380" width="143" height="46" class="unallocated"/>
      <rect x="143" y="380" width="107" height="46" class="average"/>
      <text x="12" y="409" class="note">単純余地57%</text>
      <text x="162" y="409" class="note">平均床43%</text>
    </g>
    <text x="24" y="553" class="metric">単純余地−最低区画 = 300.3㎡</text>
    <text x="24" y="579" class="note">整数配置のため最初に描く</text>
  </g>

  <g transform="translate(1365 118)">
    <rect width="310" height="600" rx="22" fill="#fff" stroke="#d9d4c8" stroke-width="2"/>
    <text x="24" y="42" class="panelTitle">10階｜高層参照</text>
    <text x="24" y="70" class="note">9居住階 × 平均9.3人</text>
    <g transform="translate(30 105)">
      <rect x="0" y="300" width="90" height="28" class="base"/>
      <rect x="0" y="300" width="50" height="28" class="public"/>
      <rect x="0" y="270" width="90" height="27" class="resident"/>
      <rect x="0" y="240" width="90" height="27" class="resident"/>
      <rect x="0" y="210" width="90" height="27" class="resident"/>
      <rect x="0" y="180" width="90" height="27" class="resident"/>
      <rect x="0" y="150" width="90" height="27" class="resident"/>
      <rect x="0" y="120" width="90" height="27" class="resident"/>
      <rect x="0" y="90" width="90" height="27" class="resident"/>
      <rect x="0" y="60" width="90" height="27" class="resident"/>
      <rect x="0" y="30" width="90" height="27" class="resident"/>
      <text x="104" y="48" class="note">12 unit ÷ 9階</text>
      <text x="104" y="69" class="note">均等に割れない</text>
      <text x="104" y="94" class="note">2 unit = 316.1㎡</text>
      <text x="104" y="115" class="note">平均床300㎡を超える</text>
      <text x="0" y="355" class="note">平均一層床300㎡</text>
      <rect x="0" y="380" width="175" height="46" class="unallocated"/>
      <rect x="175" y="380" width="75" height="46" class="average"/>
      <text x="12" y="409" class="note">単純余地70%</text>
      <text x="184" y="409" class="note">平均床30%</text>
    </g>
    <text x="24" y="553" class="metric">単純余地−最低区画 = 428.9㎡</text>
    <text x="24" y="579" class="note">ユニット分割の境界参照</text>
  </g>

  <g transform="translate(45 755)">
    <rect width="1610" height="130" rx="18" class="warn"/>
    <text x="24" y="34" class="metric">読み方と次の判断</text>
    <text x="24" y="66" class="metric">灰色＝平均一層床を引いた未配分の単純余地。建築面積・使える空地ではない</text>
    <text x="790" y="66" class="metric">5・6・7階を最大投影、三動線、階別コア、建設・運営費で比較</text>
    <text x="24" y="98" class="metric">20:00は段階実証後の予約利用上限。管理者不在・学生単独では開けない</text>
    <text x="930" y="98" class="note">未反映：車路、消防、基本空地、ごみ、前庭、確定境界</text>
  </g>
</svg>
