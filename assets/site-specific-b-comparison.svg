<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">B1交差点寄りとB2道路中央の配置比較</title>
  <desc id="desc">不整形な想定敷地に、基準165平方メートルの公開交流核を交差点寄りに置くB1案と道路中央に置くB2案を、同じ公開面積と外構条件で比較する概念図。位置は未確定。</desc>
  <defs>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", sans-serif; fill: #142633; }
      .panel-title { font-size: 25px; font-weight: 900; }
      .label { font-size: 18px; font-weight: 850; }
      .small { font-size: 15px; fill: #5d6b72; }
      .tiny { font-size: 13px; fill: #5d6b72; }
      .route { fill: none; stroke-width: 6; stroke-linecap: round; stroke-linejoin: round; }
    </style>
    <pattern id="privateFill" width="22" height="22" patternUnits="userSpaceOnUse">
      <rect width="22" height="22" fill="#dce9e9"/>
      <path d="M0 22 22 0" stroke="#123b4a" stroke-opacity=".09"/>
    </pattern>
    <pattern id="publicFill" width="22" height="22" patternUnits="userSpaceOnUse">
      <rect width="22" height="22" fill="#f8e2dc"/>
      <path d="M6 0v22M17 0v22" stroke="#ba4934" stroke-opacity=".22" stroke-width="2"/>
    </pattern>
    <marker id="arrowPublic" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 10 5 0 10z" fill="#ba4934"/>
    </marker>
    <marker id="arrowResident" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 10 5 0 10z" fill="#176b61"/>
    </marker>
  </defs>

  <rect width="1200" height="700" rx="28" fill="#fffdf8"/>
  <text x="50" y="58" font-size="31" font-weight="900">B「角の交流核」｜位置を決める前の二案比較</text>
  <text x="50" y="89" class="small">配布敷地図から作る判断図。寸法入り配置図ではなく、同じ165㎡・同じ外構条件で比較する。</text>

  <g transform="translate(42 122)">
    <rect width="535" height="490" rx="20" fill="#ffffff" stroke="#d9d4c8" stroke-width="2"/>
    <text x="28" y="42" class="panel-title">B1 交差点寄り</text>
    <text x="28" y="68" class="small">見つけやすさを優先する第一仮説</text>

    <path d="M64 104 438 88 478 352 410 402 118 426 72 326Z" fill="#f6f2e9" stroke="#142633" stroke-width="4"/>
    <path d="M116 132 391 119 421 288 328 305 240 344 132 366 100 305Z" fill="url(#privateFill)" stroke="#123b4a" stroke-width="3"/>
    <path d="M318 267 419 255 452 342 379 382 300 329Z" fill="#f4ead2" stroke="#8a6218" stroke-width="3"/>
    <path d="M385 310 461 298 475 353 414 391 365 350Z" fill="url(#publicFill)" stroke="#ba4934" stroke-width="4"/>

    <text x="194" y="218" class="label">居住</text>
    <text x="183" y="241" class="tiny">隣接住宅側は視線・静穏を検証</text>
    <text x="309" y="304" class="label">管理</text>
    <text x="386" y="333" class="label">公開</text>
    <text x="383" y="354" class="tiny">基準165㎡</text>

    <path d="M492 416 448 367" class="route" stroke="#ba4934" marker-end="url(#arrowPublic)"/>
    <path d="M42 422 123 358 129 215" class="route" stroke="#176b61" marker-end="url(#arrowResident)"/>
    <text x="363" y="437" class="small">交差点側から公開</text>
    <text x="28" y="458" class="small">別方向から帰宅</text>

    <path d="M42 442 485 405" stroke="#8a9296" stroke-width="10" stroke-linecap="round"/>
    <path d="M487 405 508 470" stroke="#8a9296" stroke-width="10" stroke-linecap="round"/>
    <text x="220" y="472" class="tiny">約48.2mの道路側（図面読取）</text>
  </g>

  <g transform="translate(623 122)">
    <rect width="535" height="490" rx="20" fill="#ffffff" stroke="#d9d4c8" stroke-width="2"/>
    <text x="28" y="42" class="panel-title">B2 道路中央</text>
    <text x="28" y="68" class="small">交差点の競合回避を優先する比較枝</text>

    <path d="M64 104 438 88 478 352 410 402 118 426 72 326Z" fill="#f6f2e9" stroke="#142633" stroke-width="4"/>
    <path d="M116 132 391 119 421 278 348 293 315 329 132 366 100 305Z" fill="url(#privateFill)" stroke="#123b4a" stroke-width="3"/>
    <path d="M247 281 371 262 410 329 338 379 235 342Z" fill="#f4ead2" stroke="#8a6218" stroke-width="3"/>
    <path d="M216 332 340 311 370 365 254 397 197 368Z" fill="url(#publicFill)" stroke="#ba4934" stroke-width="4"/>

    <text x="194" y="218" class="label">居住</text>
    <text x="183" y="241" class="tiny">公開帯を長くしない</text>
    <text x="270" y="307" class="label">管理</text>
    <text x="238" y="354" class="label">公開</text>
    <text x="237" y="376" class="tiny">基準165㎡</text>

    <path d="M288 454 282 389" class="route" stroke="#ba4934" marker-end="url(#arrowPublic)"/>
    <path d="M42 422 123 358 129 215" class="route" stroke="#176b61" marker-end="url(#arrowResident)"/>
    <text x="225" y="475" class="small">道路中央から公開</text>
    <text x="28" y="458" class="small">別方向から帰宅</text>

    <path d="M42 442 485 405" stroke="#8a9296" stroke-width="10" stroke-linecap="round"/>
    <path d="M487 405 508 470" stroke="#8a9296" stroke-width="10" stroke-linecap="round"/>
    <text x="372" y="442" class="tiny">交差点</text>
  </g>

  <g transform="translate(54 653)">
    <circle cx="8" cy="0" r="8" fill="#ba4934"/><text x="24" y="6" class="small">公開165㎡</text>
    <circle cx="145" cy="0" r="8" fill="#8a6218"/><text x="161" y="6" class="small">緩衝・管理</text>
    <circle cx="304" cy="0" r="8" fill="#176b61"/><text x="320" y="6" class="small">居住者動線</text>
    <text x="565" y="6" class="small">位置は未確定｜接道・乗入れ・消防・駐輪・歩行者流を同条件で確認して選ぶ</text>
  </g>
</svg>
